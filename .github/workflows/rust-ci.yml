name: Rust CI
on:
  push:
    branches:
      - main
      - feat/rust-renderer-foundation
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Compile and lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Build diagnostic executable
        run: cargo build --release --bin circlesrust-preview
      - name: Test CPU image export
        run: cargo run --release --bin circlesrust-preview -- preview.bmp 96 64
      - name: Upload Windows diagnostic executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: circlesrust-preview-windows
          path: |
            target/release/circlesrust-preview.exe
            preview.bmp
          if-no-files-found: error
