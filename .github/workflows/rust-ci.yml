name: Rust CI
on:
  push:
    branches:
      - main
      - feat/rust-renderer-foundation
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Compile and lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Run geometry and path-tracing tests
        run: cargo test --all-targets
      - name: Build optimized CPU path tracer
        run: cargo build --release --bin circlesrust-preview
      - name: Smoke test PNG path tracing
        run: cargo run --release --bin circlesrust-preview -- preview.png 128 80 8
      - name: Smoke test backward-compatible BMP export
        run: cargo run --release --bin circlesrust-preview -- preview.bmp 48 32 2
      - name: Render Full HD evaluation image (Windows)
        if: runner.os == 'Windows'
        run: cargo run --release --bin circlesrust-preview -- avaliacao_fullhd_1920x1080_64spp.png 1920 1080 64
      - name: Publish Windows executable, scripts and Full HD preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: circlesrust-pathtracer-windows
          path: |
            target/release/circlesrust-preview.exe
            avaliacao_fullhd_1920x1080_64spp.png
            preview.png
            preview.bmp
            RENDER_QUALIDADE_WINDOWS.bat
          if-no-files-found: error
