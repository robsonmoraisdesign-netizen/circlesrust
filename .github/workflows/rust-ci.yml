name: Rust CI
on:
  push:
    branches:
      - main
      - feat/cycles-shading-mis-denoise
      - feat/cycles-sah-mtl-materials
      - feat/rust-uv-textures-shader-graph
      - feat/pbr-texture-channels-normals
      - feat/native-rust-desktop-studio
      - feat/interactive-preview-realtime-ui
      - feat/pan-navigation-fast-preview
      - feat/scene-object-selection-focus-ui
      - feat/native-object-transforms-gizmo-v1
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Compile and lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Run geometry, OBJ and shading tests
        run: cargo test --all-targets
      - name: Build optimized CPU path tracer
        run: cargo build --release --bin circlesrust-preview
      - name: Smoke test PNG path tracing with denoise
        run: cargo run --release --bin circlesrust-preview -- preview.png 128 80 8 --denoise 2
      - name: Smoke test backward-compatible BMP export
        run: cargo run --release --bin circlesrust-preview -- preview.bmp 48 32 2 --no-denoise
      - name: Smoke test OBJ import
        run: cargo run --release --bin circlesrust-preview -- imported_obj.png 96 64 4 --obj tests/fixtures/pyramid.obj
      - name: Smoke test OBJ MTL multi-material import
        run: cargo run --release --bin circlesrust-preview -- imported_materials.png 180 120 8 --obj tests/fixtures/colored.obj --mtl tests/fixtures/colored.mtl
      - name: Smoke test textured OBJ using shader graphs
        run: cargo run --release --bin circlesrust-preview -- imported_textured.png 480 320 24 --obj tests/fixtures/textured.obj --mtl tests/fixtures/textured.mtl --denoise 2
      - name: Smoke test PBR roughness metallic and tangent-normal maps
        run: cargo run --release --bin circlesrust-preview -- imported_pbr.png 480 320 24 --obj tests/fixtures/pbr_textures.obj --mtl tests/fixtures/pbr_textures.mtl --denoise 2
      - name: Smoke test image-based environment lighting
        run: cargo run --release --bin circlesrust-preview -- mapped_environment.png 320 200 8 --environment tests/fixtures/checker.ppm --env-strength 1.4
      - name: Render Full HD evaluation with smooth normals and MIS (Windows)
        if: runner.os == 'Windows'
        run: cargo run --release --bin circlesrust-preview -- avaliacao_fullhd_mis_denoise_1920x1080_64spp.png 1920 1080 64 --denoise 2
      - name: Comparison without denoise (Windows)
        if: runner.os == 'Windows'
        run: cargo run --release --bin circlesrust-preview -- comparacao_sem_denoise.png 640 360 16 --no-denoise
      - name: Comparison with denoise (Windows)
        if: runner.os == 'Windows'
        run: cargo run --release --bin circlesrust-preview -- comparacao_com_denoise.png 640 360 16 --denoise 3
      - name: Publish Windows executable and quality previews
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: circlesrust-render-mis-denoise-windows
          path: |
            target/release/circlesrust-preview.exe
            avaliacao_fullhd_mis_denoise_1920x1080_64spp.png
            comparacao_sem_denoise.png
            comparacao_com_denoise.png
            imported_obj.png
            imported_materials.png
            imported_textured.png
            imported_pbr.png
            mapped_environment.png
            preview.png
            preview.bmp
            RENDER_QUALIDADE_WINDOWS.bat
          if-no-files-found: error


  desktop-windows:
    name: Native RV Studio desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile graphical app (Rust egui)
        run: cargo build --release --features desktop-ui --bin circlesrust-studio
      - name: Upload executable Windows desktop
        uses: actions/upload-artifact@v4
        with:
          name: RV-Studio-CirclesRust-Windows-Desktop
          path: |
            target/release/circlesrust-studio.exe
            docs/GUI_DESKTOP_RUST.md
          if-no-files-found: error
